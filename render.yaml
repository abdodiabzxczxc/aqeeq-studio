services:
  - type: web
    name: aqeeq-studio
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: aqeeq2026
      - key: JWT_SECRET
        value: aqeeq-studio-jwt-secret-key-2026
